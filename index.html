<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eth-encrypted-diary</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a10;
            color: #c0c0cc;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #login {
            width: 380px;
            padding: 40px 32px;
            background: #121218;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
        }

        #login h1 {
            font-size: 18px;
            font-weight: 500;
            color: #e0e0e8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #login h1 .icon { color: #7F77DD; }

        #login .sub {
            font-size: 13px;
            color: #aaaacc;
            margin-bottom: 28px;
        }

        .step { margin-bottom: 20px; }

        .step-label {
            font-size: 12px;
            color: #aeb0c0;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .step-num {
            width: 20px; height: 20px;
            border-radius: 50%;
            background: #1e1e2a;
            color: #7F77DD;
            font-size: 11px;
            display: flex; align-items: center; justify-content: center;
        }

        .step-num.done { background: #534AB7; color: #fff; }

        #btn-connect {
            width: 100%; padding: 12px;
            background: #1e1e2a; border: 1px solid #2a2a3a; border-radius: 8px;
            color: #c0c0cc; font-size: 14px; cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        #btn-connect:hover { background: #24243a; border-color: #534AB7; }
        #btn-connect.connected { border-color: #534AB7; background: #1a1a26; cursor: default; }

        #wallet-info { font-size: 12px; color: #5DCAA5; margin-top: 6px; display: none; }
        #password-section { display: none; }

        #password-input {
            width: 100%; padding: 12px;
            background: #1e1e2a; border: 1px solid #2a2a3a; border-radius: 8px;
            color: #e0e0e8; font-size: 14px; outline: none;
            transition: border-color 0.2s;
        }

        #password-input:focus { border-color: #534AB7; }

        #btn-unlock {
            width: 100%; padding: 12px; margin-top: 10px;
            background: #534AB7; border: none; border-radius: 8px;
            color: #fff; font-size: 14px; font-weight: 500; cursor: pointer;
            transition: background 0.2s;
        }

        #btn-unlock:hover { background: #7F77DD; }
        #btn-unlock:disabled { background: #2a2a3a; color: #8888aa; cursor: not-allowed; }

        #status { font-size: 12px; margin-top: 12px; display: none; }
        #status.ok { color: #5DCAA5; display: block; }
        #status.err { color: #E24B4A; display: block; }

        #app { display: none; width: 100%; height: 100vh; flex-direction: column; }

        #app-header {
            padding: 14px 20px;
            background: #121218;
            border-bottom: 1px solid #2a2a3a;
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
        }

        #app-header .title {
            font-size: 15px; font-weight: 500; color: #e0e0e8;
            display: flex; align-items: center; gap: 8px;
        }

        #app-header .title .icon { color: #7F77DD; }

        #app-header .meta { display: flex; align-items: center; gap: 10px; }

        .badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; }
        .badge-addr { color: #aeb0c0; background: #1e1e2a; }
        .badge-net { color: #5DCAA5; background: #0a1f18; }

        #app-body { display: flex; flex: 1; overflow: hidden; }

        #sidebar {
            width: 260px;
            border-right: 1px solid #2a2a3a;
            background: #121218;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        #sidebar-header {
            padding: 12px;
            border-bottom: 1px solid #2a2a3a;
        }

        #btn-new {
            width: 100%; padding: 10px;
            background: #534AB7; border: none; border-radius: 8px;
            color: #fff; font-size: 13px; font-weight: 500; cursor: pointer;
            transition: background 0.2s;
        }

        #btn-new:hover { background: #7F77DD; }

        #entry-list {
            flex: 1; overflow-y: auto; padding: 8px;
        }

        .entry-item {
            padding: 10px 12px;
            background: #1a1a26;
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            border: 1px solid transparent;
        }

        .entry-item:hover { background: #20202e; }
        .entry-item.active { background: #24243a; border-color: #534AB7; }

        .entry-item .date { font-size: 12px; color: #aeb0c0; }
        .entry-item .preview {
            font-size: 12px; color: #888;
            margin-top: 4px;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
        }

        .entry-item .attach-icon { font-size: 13px; color: #c0c0cc; margin-right: 2px; }

        #main {
            flex: 1; background: #0e0e16;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        #main-empty {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: #8888aa; font-size: 14px;
        }

        #entry-view {
            flex: 1; padding: 24px; overflow-y: auto; display: none;
        }

        #entry-view .entry-date { font-size: 12px; color: #aeb0c0; margin-bottom: 12px; }
        #entry-view .entry-text { font-size: 14px; color: #d0d0dc; line-height: 1.8; }
        #entry-view .entry-attachment {
            margin-top: 16px; padding-top: 16px;
            border-top: 1px solid #2a2a3a;
        }
        #entry-view .entry-attachment img { max-width: 100%; border-radius: 8px; }
        #entry-view .entry-actions {
            margin-top: 20px; padding-top: 16px;
            border-top: 1px solid #2a2a3a;
            display: flex; gap: 8px;
        }

        .btn-action {
            font-size: 12px; padding: 6px 14px;
            background: #1e1e2a; border: 1px solid #2a2a3a; border-radius: 6px;
            color: #aeb0c0; cursor: pointer;
            transition: background 0.2s;
        }

        .btn-action:hover { background: #24243a; }
        .btn-action.danger:hover { background: #3a1a1a; border-color: #E24B4A; color: #E24B4A; }

        #compose {
            display: none; flex-direction: column;
            flex: 1; padding: 24px; overflow-y: auto;
        }

        #compose.drag-over {
            background: #1a1a2a;
            border: 2px dashed #534AB7;
            border-radius: 8px;
        }

        #compose-title {
            font-size: 14px; font-weight: 500; color: #e0e0e8;
            margin-bottom: 16px;
        }

        #compose-text {
            width: 100%; min-height: 200px; padding: 14px;
            background: #1a1a26; border: 1px solid #2a2a3a; border-radius: 8px;
            color: #e0e0e8; font-size: 14px; font-family: inherit;
            line-height: 1.8; resize: vertical; outline: none;
            transition: border-color 0.2s;
        }

        #compose-text:focus { border-color: #534AB7; }

        #compose-file-section {
            margin-top: 12px;
            display: flex; align-items: center; gap: 10px;
        }

        #compose-file {
            display: none;
        }

        #btn-attach {
            font-size: 13px; padding: 8px 14px;
            background: #1e1e2a; border: 1px solid #2a2a3a; border-radius: 8px;
            color: #aeb0c0; cursor: pointer;
            transition: background 0.2s;
        }

        #btn-attach:hover { background: #24243a; }

        #file-name { font-size: 12px; color: #aeb0c0; }

        #compose-actions {
            margin-top: 16px;
            display: flex; gap: 10px;
        }

        #btn-save {
            padding: 10px 24px;
            background: #534AB7; border: none; border-radius: 8px;
            color: #fff; font-size: 13px; font-weight: 500; cursor: pointer;
            transition: background 0.2s;
        }

        #btn-save:hover { background: #7F77DD; }
        #btn-save:disabled { background: #2a2a3a; color: #8888aa; cursor: not-allowed; }

        #btn-cancel {
            padding: 10px 24px;
            background: transparent; border: 1px solid #2a2a3a; border-radius: 8px;
            color: #aeb0c0; font-size: 13px; cursor: pointer;
            transition: background 0.2s;
        }

        #btn-cancel:hover { background: #1e1e2a; }

        #save-status {
            font-size: 12px; margin-top: 10px;
            color: #aeb0c0;
        }

        #loading-overlay {
            display: none;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10,10,16,0.8);
            z-index: 100;
            align-items: center; justify-content: center;
            flex-direction: column; gap: 12px;
            color: #aeb0c0; font-size: 14px;
        }

        #loading-overlay .spinner {
            width: 32px; height: 32px;
            border: 3px solid #2a2a3a;
            border-top-color: #7F77DD;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #btn-advanced {
            background: none; border: none;
            color: #666; font-size: 16px; cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }

        #btn-advanced:hover { color: #aeb0c0; }

        #modal-overlay {
            display: none;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10,10,16,0.85);
            z-index: 200;
            align-items: center; justify-content: center;
        }

        #modal {
            background: #121218;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 24px;
            width: 400px;
            max-width: 90vw;
        }

        #modal-title {
            font-size: 15px; font-weight: 500; color: #e0e0e8;
            margin-bottom: 16px;
        }

        #modal-body {
            font-size: 13px; color: #aeb0c0;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        #modal-body input {
            width: 100%; padding: 10px;
            background: #1e1e2a; border: 1px solid #2a2a3a; border-radius: 8px;
            color: #e0e0e8; font-size: 14px; outline: none;
            margin-top: 8px;
            transition: border-color 0.2s;
        }

        #modal-body input:focus { border-color: #534AB7; }

        #modal-actions {
            display: flex; gap: 10px; justify-content: flex-end;
        }

        .modal-btn {
            padding: 8px 18px;
            border: none; border-radius: 8px;
            font-size: 13px; cursor: pointer;
            transition: background 0.2s;
        }

        .modal-btn-cancel {
            background: #1e1e2a; color: #aeb0c0;
            border: 1px solid #2a2a3a;
        }

        .modal-btn-cancel:hover { background: #24243a; }

        .modal-btn-danger {
            background: #6B2020; color: #E8A0A0;
        }

        .modal-btn-danger:hover { background: #8B3030; }

        .modal-btn-primary {
            background: #534AB7; color: #fff;
        }

        .modal-btn-primary:hover { background: #7F77DD; }

        .advanced-btn {
            width: 100%; padding: 12px;
            background: #1e1e2a; border: 1px solid #2a2a3a; border-radius: 8px;
            color: #aeb0c0; font-size: 13px; cursor: pointer;
            text-align: left;
            margin-bottom: 8px;
            transition: background 0.2s;
            display: flex; align-items: center; gap: 10px;
        }

        .advanced-btn:hover { background: #24243a; }

        .advanced-btn .desc {
            font-size: 11px; color: #666; margin-top: 2px;
        }
    </style>
</head>
<body>

<div id="login">
    <h1><span class="icon">&#9670;</span> eth-encrypted-diary</h1>
    <p class="sub">暗号化ブロックチェーン日記</p>
    <div class="step">
        <div class="step-label"><span class="step-num" id="step1-num">1</span> ウォレット接続</div>
        <button id="btn-connect" onclick="connectWallet()">MetaMaskに接続</button>
        <div id="wallet-info"></div>
    </div>
    <div id="password-section" class="step">
        <div class="step-label"><span class="step-num" id="step2-num">2</span> パスワード入力</div>
        <input type="password" id="password-input" placeholder="暗号化パスワード">
        <button id="btn-unlock" onclick="deriveKey()" disabled>鍵を導出してログイン</button>
    </div>
    <div id="status"></div>
</div>

<div id="app">
    <div id="app-header">
        <div class="title"><span class="icon">&#9670;</span> eth-encrypted-diary</div>
        <div class="meta">
            <span class="badge badge-addr" id="app-addr"></span>
            <span class="badge badge-net" id="app-net"></span>
            <button id="btn-advanced" onclick="showAdvancedPrompt()"><i class="ti ti-settings"></i></button>
        </div>
    </div>
    <div id="app-body">
        <div id="sidebar">
            <div id="sidebar-header">
                <button id="btn-new" onclick="showCompose()">+ 新しい日記</button>
            </div>
            <div id="entry-list"></div>
        </div>
        <div id="main">
            <div id="main-empty">日記を選択するか、新しく書いてください</div>
            <div id="entry-view">
                <div class="entry-date" id="view-date"></div>
                <div class="entry-text" id="view-text"></div>
                <div class="entry-attachment" id="view-attachment"></div>
                <div class="entry-actions">
                    <button class="btn-action danger" onclick="deleteEntry()">削除</button>
                </div>
            </div>
            <div id="compose">
                <div id="compose-title">新しい日記</div>
                <textarea id="compose-text" placeholder="今日のできごとを書く..."></textarea>
                <div id="compose-file-section">
                    <button id="btn-attach" onclick="document.getElementById('compose-file').click()">添付ファイル</button>
                    <input type="file" id="compose-file" accept="image/*,audio/*,video/*" onchange="onFileSelect(this)">
                    <span id="file-name"></span>
                </div>
                <div id="compose-actions">
                    <button id="btn-save" onclick="saveEntry()">保存</button>
                    <button id="btn-cancel" onclick="hideCompose()">キャンセル</button>
                </div>
                <div id="save-status"></div>
            </div>
        </div>
    </div>
</div>

<div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">処理中...</div>
</div>

<div id="modal-overlay" onclick="closeModal(event)">
    <div id="modal">
        <div id="modal-title"></div>
        <div id="modal-body"></div>
        <div id="modal-actions"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
<script>
    const CONFIG = {
        contractAddress: '0x658F273a36C671fd88FD79fa931D9e2b867D27AC',
        apiUrl: 'https://eth-encrypted-diary.vercel.app/api/pin',
        gatewayUrl: 'https://gateway.pinata.cloud/ipfs/',
        chainId: 84532
    };

    const ABI = [
        "function post(string cid, uint8 entry_type, string new_index_cid) external",
        "function delete_entries(uint256[] ids, string new_index_cid) external",
        "function restore_entries(uint256[] ids, string new_index_cid) external",
        "function update_index(string new_index_cid) external",
        "function get_entries(uint256 from, uint256 to) external view returns (string[], bool[])",
        "function owner() external view returns (address)",
        "function entry_count() external view returns (uint256)",
        "function index_cid() external view returns (string)",
        "function entries(uint256) external view returns (string)",
        "function deleted(uint256) external view returns (bool)"
    ];

    let walletAddress = null;
    let aesKey = null;
    let provider = null;
    let signer = null;
    let contract = null;
    let diaryIndex = [];
    let currentEntryId = null;

    async function connectWallet() {
        if (!window.ethereum) { showStatus('MetaMaskがインストールされていません', 'err'); return; }
        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            walletAddress = accounts[0];
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            const network = await provider.getNetwork();

            document.getElementById('btn-connect').textContent = shortenAddr(walletAddress);
            document.getElementById('btn-connect').classList.add('connected');
            document.getElementById('wallet-info').textContent = 'Chain ID: ' + network.chainId.toString();
            document.getElementById('wallet-info').style.display = 'block';
            document.getElementById('step1-num').classList.add('done');
            document.getElementById('step1-num').textContent = '\u2713';
            document.getElementById('password-section').style.display = 'block';
            document.getElementById('password-input').focus();
            document.getElementById('password-input').addEventListener('input', function() {
                document.getElementById('btn-unlock').disabled = this.value.length === 0;
            });
            document.getElementById('password-input').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && this.value.length > 0) deriveKey();
            });
            window.ethereum.on('accountsChanged', function() { location.reload(); });
            window.ethereum.on('chainChanged', function() { location.reload(); });
        } catch (err) {
            showStatus('接続がキャンセルされました', 'err');
        }
    }

    async function deriveKey() {
        const password = document.getElementById('password-input').value;
        if (!password || !walletAddress) return;
        document.getElementById('btn-unlock').disabled = true;
        document.getElementById('btn-unlock').textContent = '導出中...';
        try {
            const enc = new TextEncoder();
            const salt = enc.encode(walletAddress.toLowerCase());
            const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
            aesKey = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: 600000, hash: 'SHA-256' },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
            document.getElementById('step2-num').classList.add('done');
            document.getElementById('step2-num').textContent = '\u2713';
            showStatus('鍵の導出に成功しました', 'ok');
            setTimeout(enterApp, 600);
        } catch (err) {
            showStatus('鍵の導出に失敗しました: ' + errMsg(err), 'err');
            document.getElementById('btn-unlock').disabled = false;
            document.getElementById('btn-unlock').textContent = '鍵を導出してログイン';
        }
    }

    async function enterApp() {
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        document.getElementById('app-addr').textContent = shortenAddr(walletAddress);

        const net = await provider.getNetwork();
        const names = { '8453': 'Base', '84532': 'Base Sepolia', '1': 'Ethereum' };
        document.getElementById('app-net').textContent = names[net.chainId.toString()] || 'Chain ' + net.chainId;

        contract = new ethers.Contract(CONFIG.contractAddress, ABI, signer);
        setupDragDrop();
        await loadIndex();
    }

    async function encrypt(data) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, aesKey, data);
        const result = new Uint8Array(12 + encrypted.byteLength);
        result.set(iv, 0);
        result.set(new Uint8Array(encrypted), 12);
        return result;
    }

    async function decrypt(blob) {
        const data = new Uint8Array(blob);
        const iv = data.slice(0, 12);
        const ciphertext = data.slice(12);
        const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, aesKey, ciphertext);
        return decrypted;
    }

    async function getTempJwt() {
        const message = Date.now().toString();
        const signature = await signer.signMessage(message);

        const res = await fetch(CONFIG.apiUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Signature': signature,
                'X-Message': message,
            },
        });

        if (!res.ok) {
            const err = await res.json();
            throw new Error(errMsg(err) || 'Failed to get upload token');
        }

        const data = await res.json();
        return data.jwt;
    }

    async function uploadToPinata(blob, filename, tempJwt) {
        const formData = new FormData();
        formData.append('file', new Blob([blob]), filename);

        const res = await fetch('https://api.pinata.cloud/pinning/pinFileToIPFS', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + tempJwt,
            },
            body: formData,
        });

        if (!res.ok) {
            const err = await res.json();
            throw new Error(errMsg(err) || 'Upload failed');
        }

        const data = await res.json();
        return data.IpfsHash;
    }

    async function fetchFromIPFS(cid) {
        const res = await fetch(CONFIG.gatewayUrl + cid);
        if (!res.ok) throw new Error('IPFS fetch failed: ' + res.status);
        return await res.arrayBuffer();
    }

    function getEntryType(file) {
        if (!file) return 0;
        if (file.type.startsWith('image/')) return 1;
        if (file.type.startsWith('audio/')) return 2;
        if (file.type.startsWith('video/')) return 3;
        return 1;
    }

    let passwordVerified = false;

    async function loadIndex() {
        try {
            const entryCount = Number(await contract.entry_count());
            const indexCid = await contract.index_cid();

            if (entryCount === 0 || !indexCid) {
                diaryIndex = [];
                passwordVerified = true;
                renderEntryList();
                return;
            }

            const encryptedBlob = await fetchFromIPFS(indexCid);
            const decrypted = await decrypt(encryptedBlob);
            const json = new TextDecoder().decode(decrypted);
            diaryIndex = JSON.parse(json);
            passwordVerified = true;
            renderEntryList();
        } catch (err) {
            console.error('Index load error:', err);
            diaryIndex = [];
            passwordVerified = false;
            renderEntryList();
            document.getElementById('main-empty').innerHTML = '<div style="color:#E24B4A;text-align:center;">復号に失敗しました<br><span style="font-size:12px;color:#aeb0c0;">パスワードまたはウォレットアドレスが<br>異なっている可能性があります。<br>正しい組み合わせで再ログインしてください。</span></div>';
            document.getElementById('btn-new').disabled = true;
            document.getElementById('btn-new').style.opacity = '0.4';
            document.getElementById('btn-new').style.cursor = 'not-allowed';
            document.getElementById('btn-advanced').disabled = true;
            document.getElementById('btn-advanced').style.opacity = '0.4';
            document.getElementById('btn-advanced').style.cursor = 'not-allowed';
        }
    }

    async function saveIndex(tempJwt) {
        const json = JSON.stringify(diaryIndex);
        const encrypted = await encrypt(new TextEncoder().encode(json));
        const cid = await uploadToPinata(encrypted, 'index.enc', tempJwt);
        return cid;
    }

    function renderEntryList() {
        const list = document.getElementById('entry-list');
        list.innerHTML = '';
        const visible = diaryIndex.filter(e => !e.deleted);
        if (visible.length === 0) {
            list.innerHTML = '<div style="padding:20px;text-align:center;color:#8888aa;font-size:13px;">まだ日記がありません</div>';
            return;
        }
        visible.sort((a, b) => new Date(b.date) - new Date(a.date));
        visible.forEach(entry => {
            const div = document.createElement('div');
            div.className = 'entry-item' + (entry.id === currentEntryId ? ' active' : '');
            const typeIcons = { 1: '<i class="ti ti-photo"></i>', 2: '<i class="ti ti-volume"></i>', 3: '<i class="ti ti-video"></i>' };
            const typeIcon = entry.entry_type > 0 ? '<span class="attach-icon">' + (typeIcons[entry.entry_type] || '<i class="ti ti-paperclip"></i>') + '</span>' : '';
            div.innerHTML = '<div class="date">' + entry.date + '</div><div class="preview">' + typeIcon + escapeHtml(entry.preview) + '</div>';
            div.onclick = () => viewEntry(entry.id);
            list.appendChild(div);
        });
    }

    function showCompose() {
        document.getElementById('main-empty').style.display = 'none';
        document.getElementById('entry-view').style.display = 'none';
        document.getElementById('compose').style.display = 'flex';
        document.getElementById('compose-text').value = '';
        document.getElementById('compose-file').value = '';
        document.getElementById('file-name').textContent = '';
        document.getElementById('save-status').textContent = '';
        document.getElementById('compose-text').focus();
    }

    function hideCompose() {
        document.getElementById('compose').style.display = 'none';
        if (currentEntryId !== null) {
            document.getElementById('entry-view').style.display = 'block';
        } else {
            document.getElementById('main-empty').style.display = 'flex';
        }
    }

    function onFileSelect(input) {
        if (input.files.length > 0) {
            document.getElementById('file-name').textContent = input.files[0].name;
        } else {
            document.getElementById('file-name').textContent = '';
        }
    }

    function setupDragDrop() {
        const compose = document.getElementById('compose');
        compose.addEventListener('dragover', function(e) {
            e.preventDefault();
            compose.classList.add('drag-over');
        });
        compose.addEventListener('dragleave', function(e) {
            e.preventDefault();
            compose.classList.remove('drag-over');
        });
        compose.addEventListener('drop', function(e) {
            e.preventDefault();
            compose.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                const input = document.getElementById('compose-file');
                const dt = new DataTransfer();
                dt.items.add(file);
                input.files = dt.files;
                document.getElementById('file-name').textContent = file.name;
            }
        });
    }

    async function saveEntry() {
        if (!passwordVerified) { document.getElementById('save-status').textContent = 'パスワードが未検証です'; return; }
        const text = document.getElementById('compose-text').value.trim();
        if (!text) { document.getElementById('save-status').textContent = 'テキストを入力してください'; return; }

        const fileInput = document.getElementById('compose-file');
        const file = fileInput.files.length > 0 ? fileInput.files[0] : null;
        const entryType = getEntryType(file);

        document.getElementById('btn-save').disabled = true;
        showLoading('暗号化中...');

        try {
            showLoading('アップロード認証中...');
            const tempJwt = await getTempJwt();

            let attachmentCid = null;
            let attachmentInfo = null;

            if (file) {
                showLoading('添付ファイルを暗号化中...');
                const fileBuffer = await file.arrayBuffer();
                const encryptedFile = await encrypt(new Uint8Array(fileBuffer));

                showLoading('添付ファイルをアップロード中...');
                attachmentCid = await uploadToPinata(encryptedFile, 'attach.enc', tempJwt);
                attachmentInfo = {
                    cid: attachmentCid,
                    name: file.name,
                    mime: file.type,
                    size: file.size
                };
            }

            showLoading('日記を暗号化中...');
            const now = new Date();
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const dateStr = now.getFullYear() + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + String(now.getDate()).padStart(2, '0') + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ' (' + days[now.getDay()] + ')';
            const metadata = {
                text: text,
                date: dateStr,
                attachments: attachmentInfo ? [attachmentInfo] : []
            };
            const metadataJson = JSON.stringify(metadata);
            const encryptedEntry = await encrypt(new TextEncoder().encode(metadataJson));

            showLoading('日記をアップロード中...');
            const entryCid = await uploadToPinata(encryptedEntry, 'entry.enc', tempJwt);

            showLoading('インデックスを更新中...');
            const entryCount = Number(await contract.entry_count());

            diaryIndex.push({
                id: entryCount,
                date: dateStr,
                preview: text.substring(0, 50),
                cid: entryCid,
                entry_type: entryType,
                deleted: false
            });

            const indexCid = await saveIndex(tempJwt);

            showLoading('ブロックチェーンに記録中...');
            const tx = await contract.post(entryCid, entryType, indexCid);
            showLoading('トランザクション確定待ち...');
            await tx.wait();

            hideLoading();
            hideCompose();
            renderEntryList();
            viewEntry(entryCount);

        } catch (err) {
            hideLoading();
            console.error('Save error:', err);
            document.getElementById('save-status').textContent = 'エラー: ' + errMsg(err);
        }

        document.getElementById('btn-save').disabled = false;
    }

    async function viewEntry(id) {
        currentEntryId = id;
        const entry = diaryIndex.find(e => e.id === id);
        if (!entry) return;

        document.getElementById('main-empty').style.display = 'none';
        document.getElementById('compose').style.display = 'none';
        document.getElementById('entry-view').style.display = 'block';

        document.getElementById('view-date').textContent = entry.date;
        document.getElementById('view-text').textContent = '読み込み中...';
        document.getElementById('view-attachment').innerHTML = '';
        renderEntryList();

        try {
            const encryptedBlob = await fetchFromIPFS(entry.cid);
            const decrypted = await decrypt(encryptedBlob);
            const metadata = JSON.parse(new TextDecoder().decode(decrypted));

            document.getElementById('view-text').textContent = metadata.text;

            if (metadata.attachments && metadata.attachments.length > 0) {
                const att = metadata.attachments[0];
                const encAttachment = await fetchFromIPFS(att.cid);
                const decAttachment = await decrypt(encAttachment);
                const blob = new Blob([decAttachment], { type: att.mime });
                const url = URL.createObjectURL(blob);

                const container = document.getElementById('view-attachment');
                if (att.mime.startsWith('image/')) {
                    container.innerHTML = '<img src="' + url + '" alt="' + escapeHtml(att.name) + '">';
                } else if (att.mime.startsWith('audio/')) {
                    container.innerHTML = '<audio controls src="' + url + '"></audio>';
                } else if (att.mime.startsWith('video/')) {
                    container.innerHTML = '<video controls src="' + url + '" style="max-width:100%;border-radius:8px;"></video>';
                }
            }
        } catch (err) {
            console.error('View error:', err);
            document.getElementById('view-text').textContent = '復号に失敗しました: ' + errMsg(err);
        }
    }

    async function deleteEntry() {
        if (currentEntryId === null) return;
        if (!confirm('この日記を削除しますか？')) return;

        showLoading('削除中...');
        try {
            const tempJwt = await getTempJwt();
            const entry = diaryIndex.find(e => e.id === currentEntryId);
            if (entry) entry.deleted = true;

            const indexCid = await saveIndex(tempJwt);
            const tx = await contract.delete_entries([currentEntryId], indexCid);
            await tx.wait();

            currentEntryId = null;
            document.getElementById('entry-view').style.display = 'none';
            document.getElementById('main-empty').style.display = 'flex';
            renderEntryList();
        } catch (err) {
            console.error('Delete error:', err);
        }
        hideLoading();
    }

    function showLoading(text) {
        document.getElementById('loading-text').textContent = text;
        document.getElementById('loading-overlay').style.display = 'flex';
    }

    function hideLoading() {
        document.getElementById('loading-overlay').style.display = 'none';
    }

    function shortenAddr(addr) {
        return addr.slice(0, 6) + '...' + addr.slice(-4);
    }

    function showStatus(msg, type) {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className = type;
    }

    function errMsg(err) {
        if (typeof err === 'string') return err;
        return err.shortMessage || err.reason || err.message || JSON.stringify(err);
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function openModal(title, bodyHtml, actions) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-body').innerHTML = bodyHtml;
        document.getElementById('modal-actions').innerHTML = actions;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal(e) {
        if (e && e.target !== document.getElementById('modal-overlay')) return;
        document.getElementById('modal-overlay').style.display = 'none';
    }

    function closeModalDirect() {
        document.getElementById('modal-overlay').style.display = 'none';
    }

    function showAdvancedPrompt() {
        openModal(
            '詳細設定',
            '<span style="color:#E24B4A;">⚠ この設定には暗号化の根幹に関わる操作が含まれます。</span><br><br>' +
            '<div style="margin:8px 0 8px 8px;line-height:2;">' +
            '・インデックス再生成 — 日記の一覧データをオンチェーンから再構築します<br>' +
            '・オーナー変更 — 暗号鍵の再生成と全エントリの再暗号化を行います</div>' +
            'この操作は必要な場合にのみ実行してください。',
            '<button class="modal-btn modal-btn-cancel" onclick="closeModalDirect()">キャンセル</button>' +
            '<button class="modal-btn modal-btn-primary" onclick="showAdvancedPanel()">表示する</button>'
        );
    }

    function showAdvancedPanel() {
        openModal(
            '詳細設定',
            '<button class="advanced-btn" onclick="showChangePasswordWarning()">' +
            '<div><div>オーナー変更</div><div class="desc">全エントリを新しい鍵で再暗号化します</div></div>' +
            '</button>' +
            '<button class="advanced-btn" onclick="showRebuildIndexWarning()">' +
            '<div><div>インデックス再構築</div><div class="desc">オンチェーンデータから一覧を再生成します</div></div>' +
            '</button>',
            '<button class="modal-btn modal-btn-cancel" onclick="closeModalDirect()">閉じる</button>'
        );
    }

    function showChangePasswordWarning() {
        openModal(
            'オーナー変更',
            '<span style="color:#E24B4A;">コントラクトの所有権を移譲し、全エントリを新しい鍵で再暗号化します。</span><br><br>' +
            'ウォレットアドレスが同じ場合はパスワードのみ変更されます。<br>' +
            'エントリ数が多い場合、長時間かかる可能性があります。<br>処理中にブラウザを閉じないでください。<br><br>' +
            '<input type="text" id="new-owner-address" placeholder="新しいウォレットアドレス" value="' + walletAddress + '">' +
            '<input type="password" id="new-password" placeholder="新しいパスワード" style="margin-top:8px;">' +
            '<input type="password" id="new-password-confirm" placeholder="新しいパスワード（確認）" style="margin-top:8px;">',
            '<button class="modal-btn modal-btn-cancel" onclick="showAdvancedPanel()">戻る</button>' +
            '<button class="modal-btn modal-btn-danger" onclick="executeChangeOwner()">変更を実行</button>'
        );
    }

    function showRebuildIndexWarning() {
        openModal(
            'インデックス再構築',
            '<span style="color:#E24B4A;">この操作はインデックスを上書きします。</span><br><br>' +
            'オンチェーンの全エントリを取得し、IPFSから復号してインデックスを再生成します。<br>' +
            'エントリ数が多い場合、長時間かかる可能性があります。',
            '<button class="modal-btn modal-btn-cancel" onclick="showAdvancedPanel()">戻る</button>' +
            '<button class="modal-btn modal-btn-danger" onclick="executeRebuildIndex()">再構築を実行</button>'
        );
    }

    async function executeChangeOwner() {
        const newAddr = document.getElementById('new-owner-address').value.trim();
        const newPw = document.getElementById('new-password').value;
        const newPwConfirm = document.getElementById('new-password-confirm').value;

        if (!newAddr) { alert('ウォレットアドレスを入力してください'); return; }
        if (!ethers.isAddress(newAddr)) { alert('無効なウォレットアドレスです'); return; }
        if (!newPw) { alert('新しいパスワードを入力してください'); return; }
        if (newPw !== newPwConfirm) { alert('パスワードが一致しません'); return; }

        const isOwnerChange = newAddr.toLowerCase() !== walletAddress.toLowerCase();

        closeModalDirect();
        showLoading('新しい鍵を導出中...');

        try {
            const enc = new TextEncoder();
            const salt = enc.encode(newAddr.toLowerCase());
            const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(newPw), 'PBKDF2', false, ['deriveKey']);
            const newKey = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: 600000, hash: 'SHA-256' },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );

            const entryCount = Number(await contract.entry_count());
            const newIndex = [];

            for (let i = 0; i < entryCount; i++) {
                showLoading('エントリ ' + (i + 1) + '/' + entryCount + ' を再暗号化中...');
                let tempJwt = await getTempJwt();

                const cid = await contract.entries(i);
                const isDeleted = await contract.deleted(i);
                const encBlob = await fetchFromIPFS(cid);
                const decrypted = await decrypt(encBlob);
                const metadata = JSON.parse(new TextDecoder().decode(decrypted));

                if (metadata.attachments && metadata.attachments.length > 0) {
                    for (let j = 0; j < metadata.attachments.length; j++) {
                        const att = metadata.attachments[j];
                        const encAtt = await fetchFromIPFS(att.cid);
                        const decAtt = await decrypt(encAtt);

                        const ivAtt = crypto.getRandomValues(new Uint8Array(12));
                        const reEncAtt = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: ivAtt }, newKey, decAtt);
                        const reEncAttBlob = new Uint8Array(12 + reEncAtt.byteLength);
                        reEncAttBlob.set(ivAtt, 0);
                        reEncAttBlob.set(new Uint8Array(reEncAtt), 12);

                        const newAttCid = await uploadToPinata(reEncAttBlob, 'attach.enc', tempJwt);
                        metadata.attachments[j].cid = newAttCid;
                    }
                }

                const ivEntry = crypto.getRandomValues(new Uint8Array(12));
                const reEncEntry = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: ivEntry }, newKey, new TextEncoder().encode(JSON.stringify(metadata)));
                const reEncEntryBlob = new Uint8Array(12 + reEncEntry.byteLength);
                reEncEntryBlob.set(ivEntry, 0);
                reEncEntryBlob.set(new Uint8Array(reEncEntry), 12);

                const newEntryCid = await uploadToPinata(reEncEntryBlob, 'entry.enc', tempJwt);

                const oldIndexEntry = diaryIndex.find(e => e.id === i);
                newIndex.push({
                    id: i,
                    date: metadata.date || (oldIndexEntry ? oldIndexEntry.date : '(日付不明)'),
                    preview: metadata.text.substring(0, 50),
                    cid: newEntryCid,
                    entry_type: oldIndexEntry ? oldIndexEntry.entry_type : 0,
                    deleted: isDeleted
                });
            }

            showLoading('新しいインデックスをアップロード中...');
            diaryIndex = newIndex;
            aesKey = newKey;

            const indexJson = JSON.stringify(diaryIndex);
            const ivIdx = crypto.getRandomValues(new Uint8Array(12));
            const encIdx = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: ivIdx }, newKey, new TextEncoder().encode(indexJson));
            const encIdxBlob = new Uint8Array(12 + encIdx.byteLength);
            encIdxBlob.set(ivIdx, 0);
            encIdxBlob.set(new Uint8Array(encIdx), 12);

            const newIndexJwt = await getTempJwt();
            const newIndexCid = await uploadToPinata(encIdxBlob, 'index.enc', newIndexJwt);

            showLoading('ブロックチェーンを更新中...');
            const tx1 = await contract.update_index(newIndexCid);
            await tx1.wait();

            if (isOwnerChange) {
                showLoading('オーナーを移譲中...');
                const tx2 = await contract.transfer_ownership(newAddr);
                await tx2.wait();
            }

            hideLoading();
            renderEntryList();

            if (isOwnerChange) {
                alert('オーナー変更が完了しました。新しいウォレット（' + newAddr.slice(0, 6) + '...' + newAddr.slice(-4) + '）と新しいパスワードで再ログインしてください。');
            } else {
                alert('パスワード変更が完了しました。次回から新しいパスワードでログインしてください。');
            }

        } catch (err) {
            hideLoading();
            console.error('Owner change error:', err);
            alert('オーナー変更に失敗しました: ' + errMsg(err));
        }
    }

    async function executeRebuildIndex() {
        closeModalDirect();
        showLoading('エントリ数を取得中...');

        try {
            const entryCount = Number(await contract.entry_count());
            if (entryCount === 0) {
                hideLoading();
                alert('エントリがありません');
                return;
            }

            const newIndex = [];
            for (let i = 0; i < entryCount; i++) {
                showLoading('エントリ ' + (i + 1) + '/' + entryCount + ' を読み込み中...');

                const cid = await contract.entries(i);
                const isDeleted = await contract.deleted(i);

                let preview = '(復号失敗)';
                let entryType = 0;
                let entryDate = '(日付不明)';
                try {
                    const encBlob = await fetchFromIPFS(cid);
                    const decrypted = await decrypt(encBlob);
                    const metadata = JSON.parse(new TextDecoder().decode(decrypted));
                    preview = metadata.text.substring(0, 50);
                    entryDate = metadata.date || '(日付不明)';
                    entryType = metadata.attachments && metadata.attachments.length > 0 ? 1 : 0;
                } catch (e) {
                    console.error('Entry ' + i + ' decrypt failed:', e);
                }

                newIndex.push({
                    id: i,
                    date: entryDate,
                    preview: preview,
                    cid: cid,
                    entry_type: entryType,
                    deleted: isDeleted
                });
            }

            showLoading('インデックスをアップロード中...');
            diaryIndex = newIndex;
            const tempJwt = await getTempJwt();
            const indexCid = await saveIndex(tempJwt);

            showLoading('ブロックチェーンを更新中...');
            const tx = await contract.update_index(indexCid);
            await tx.wait();

            hideLoading();
            renderEntryList();
            alert('インデックス再構築が完了しました（' + entryCount + '件）');

        } catch (err) {
            hideLoading();
            console.error('Rebuild error:', err);
            alert('再構築に失敗しました: ' + errMsg(err));
        }
    }
</script>
